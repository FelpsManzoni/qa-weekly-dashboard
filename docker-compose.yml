services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qa_password}
      POSTGRES_DB: ${POSTGRES_DB:-qa_dashboard}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-qa} -d ${POSTGRES_DB:-qa_dashboard}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-qa}:${POSTGRES_PASSWORD:-qa_password}@db:5432/${POSTGRES_DB:-qa_dashboard}
      JWT_SECRET: ${JWT_SECRET:-please-change-me}
      PORT: 3000
      # Optionally seed sample data on first boot by pointing SEED_FILE at the bundled seed.
      SEED_FILE: ${SEED_FILE:-}
    expose:
      - '3000'

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${HOST_PORT:-8080}:80'

volumes:
  db_data:
