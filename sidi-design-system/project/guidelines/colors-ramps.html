<!-- @dsCard group="Colors" viewport="700x120" subtitle="Green &amp; purple ramps used for accents, charts, and status" name="Brand Ramps" -->
<html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-mono);font-size:10px;background:var(--surface-card)}
.ramp{display:flex;height:56px}
.c{flex:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;color:#111}
</style></head>
<body>
<div class="ramp">
  <div class="c" style="background:var(--green-50)">50</div>
  <div class="c" style="background:var(--green-100)">100</div>
  <div class="c" style="background:var(--green-300)">300</div>
  <div class="c" style="background:var(--green-500)">500</div>
  <div class="c" style="background:var(--green-700);color:#fff">700</div>
  <div class="c" style="background:var(--green-900);color:#fff">900</div>
</div>
<div class="ramp">
  <div class="c" style="background:var(--purple-50)">50</div>
  <div class="c" style="background:var(--purple-100)">100</div>
  <div class="c" style="background:var(--purple-300)">300</div>
  <div class="c" style="background:var(--purple-500);color:#fff">500</div>
  <div class="c" style="background:var(--purple-700);color:#fff">700</div>
  <div class="c" style="background:var(--purple-900);color:#fff">900</div>
</div>
</body></html>
