<!-- @dsCard group="Colors" viewport="700x90" subtitle="Grayscale UI surfaces &amp; text, derived from brand gray + black" name="Neutral Scale" -->
<html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-mono);font-size:10px;background:var(--surface-card)}
.ramp{display:flex;height:90px}
.c{flex:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;color:#111;border-right:1px solid rgba(0,0,0,.05)}
</style></head>
<body>
<div class="ramp">
  <div class="c" style="background:var(--neutral-0)">0</div>
  <div class="c" style="background:var(--neutral-50)">50</div>
  <div class="c" style="background:var(--neutral-100)">100</div>
  <div class="c" style="background:var(--neutral-200)">200</div>
  <div class="c" style="background:var(--neutral-300)">300</div>
  <div class="c" style="background:var(--neutral-400)">400</div>
  <div class="c" style="background:var(--neutral-500);color:#fff">500</div>
  <div class="c" style="background:var(--neutral-600);color:#fff">600</div>
  <div class="c" style="background:var(--neutral-700);color:#fff">700</div>
  <div class="c" style="background:var(--neutral-800);color:#fff">800</div>
  <div class="c" style="background:var(--neutral-900);color:#fff">900</div>
  <div class="c" style="background:var(--neutral-1000);color:#fff">1000</div>
</div>
</body></html>
