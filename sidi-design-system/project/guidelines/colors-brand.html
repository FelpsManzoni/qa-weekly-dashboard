<!-- @dsCard group="Colors" viewport="700x170" subtitle="Brand palette, straight from Paleta de cores.webp" name="Brand Colors" -->
<html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-body);background:var(--surface-card)}
.row{display:flex;height:170px}
.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:10px 12px;color:#fff;font-size:12px;gap:2px}
.sw.light{color:#111}
.hex{font-family:var(--font-mono);font-size:11px;opacity:.85}
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:var(--sidi-green-dark)"><b>Green Dark</b><span class="hex">#006325</span></div>
  <div class="sw light" style="background:var(--sidi-green-bright)"><b>Green Bright</b><span class="hex">#00ed3c</span></div>
  <div class="sw" style="background:var(--sidi-purple-dark)"><b>Purple Dark</b><span class="hex">#480e60</span></div>
  <div class="sw light" style="background:var(--sidi-purple-light)"><b>Purple Light</b><span class="hex">#b094fb</span></div>
  <div class="sw" style="background:var(--sidi-black)"><b>Black</b><span class="hex">#000000</span></div>
  <div class="sw" style="background:var(--sidi-gray)"><b>Gray</b><span class="hex">#979a9c</span></div>
</div>
</body></html>
