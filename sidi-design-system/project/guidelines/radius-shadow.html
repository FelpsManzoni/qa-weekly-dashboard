<!-- @dsCard group="Spacing" viewport="700x140" subtitle="Corner radius &amp; elevation shadows" name="Radius &amp; Shadow" -->
<html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px 24px;font-family:var(--font-mono);font-size:11px;background:var(--surface-page);color:var(--text-secondary);display:flex;gap:20px}
.box{width:64px;height:64px;background:var(--surface-card);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;border:1px solid var(--border-subtle)}
</style></head>
<body>
<div class="box" style="border-radius:var(--radius-sm)">sm</div>
<div class="box" style="border-radius:var(--radius-md)">md</div>
<div class="box" style="border-radius:var(--radius-lg)">lg</div>
<div class="box" style="border-radius:var(--radius-sm);box-shadow:var(--shadow-sm)">sh-sm</div>
<div class="box" style="border-radius:var(--radius-sm);box-shadow:var(--shadow-md)">sh-md</div>
<div class="box" style="border-radius:var(--radius-sm);box-shadow:var(--shadow-lg)">sh-lg</div>
</body></html>
