<!-- @dsCard group="QA Dashboard" viewport="1600x900" name="Project Registry" subtitle="Manage QA projects - create, edit, delete" -->
<html>
<head>
  <link rel="stylesheet" href="../../styles.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--surface-page); }
    body { font-family: var(--font-body); color: var(--text-primary); }
  </style>
</head>
<body>
  <div style="display: flex; height: 100vh;">
    <!-- Sidebar -->
    <div style="width: 280px; background: var(--surface-card); border-right: 1px solid var(--border-subtle); padding: var(--space-5); overflow-y: auto;">
      <div style="display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-8);">
        <img src="../../assets/logos/sidi-symbol-dark-green.png" style="width: 28px; height: 28px;">
        <div style="font-weight: 700; font-family: var(--font-display); font-size: var(--text-lg);">SiDi QA</div>
      </div>
      <nav style="display: flex; flex-direction: column; gap: var(--space-2);">
        <a href="#" style="padding: var(--space-3) var(--space-3); border-radius: var(--radius-sm); color: var(--text-secondary); text-decoration: none; font-size: var(--text-sm);">Dashboard</a>
        <a href="#" style="padding: var(--space-3) var(--space-3); border-radius: var(--radius-sm); color: var(--text-secondary); text-decoration: none; font-size: var(--text-sm);">Weekly Report</a>
        <a href="#" style="padding: var(--space-3) var(--space-3); border-radius: var(--radius-sm); background: var(--brand-primary); color: var(--text-inverse); text-decoration: none; font-weight: 600; font-size: var(--text-sm);">Projects</a>
      </nav>
    </div>

    <!-- Main Content -->
    <div style="flex: 1; overflow-y: auto;">
      <div style="padding: var(--space-8);">
        <!-- Header -->
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: var(--space-8);">
          <div>
            <h1 style="margin: 0 0 var(--space-2) 0; font-size: var(--text-4xl); font-weight: 700;">Project Registry</h1>
            <p style="margin: 0; color: var(--text-secondary); font-size: var(--text-sm);">Create and manage QA projects</p>
          </div>
          <button style="padding: var(--space-3) var(--space-6); background: var(--brand-primary); color: var(--text-inverse); border: none; border-radius: var(--radius-sm); font-weight: 600; font-size: var(--text-base); cursor: pointer;">
            + New Project
          </button>
        </div>

        <!-- Two Column Layout: Form + Table -->
        <div style="display: grid; grid-template-columns: 400px 1fr; gap: var(--space-8);">
          <!-- Form -->
          <div style="background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: var(--space-6); height: fit-content;">
            <h2 style="margin: 0 0 var(--space-6) 0; font-size: var(--text-lg); font-weight: 600;">New Project</h2>
            
            <form style="display: flex; flex-direction: column; gap: var(--space-5);">
              <div>
                <label style="display: block; font-size: var(--text-sm); font-weight: 600; margin-bottom: var(--space-2); color: var(--text-primary);">
                  Project Name
                </label>
                <input
                  type="text"
                  placeholder="e.g., Samsung BIXBY"
                  style="width: 100%; padding: var(--space-3) var(--space-4); border: 1px solid var(--border-default); border-radius: var(--radius-sm); font-size: var(--text-base); font-family: var(--font-body); outline: none;"
                />
              </div>

              <div>
                <label style="display: block; font-size: var(--text-sm); font-weight: 600; margin-bottom: var(--space-2); color: var(--text-primary);">
                  Project Code
                </label>
                <input
                  type="text"
                  placeholder="e.g., BXB"
                  style="width: 100%; padding: var(--space-3) var(--space-4); border: 1px solid var(--border-default); border-radius: var(--radius-sm); font-size: var(--text-base); font-family: var(--font-body); outline: none;"
                />
              </div>

              <div>
                <label style="display: block; font-size: var(--text-sm); font-weight: 600; margin-bottom: var(--space-2); color: var(--text-primary);">
                  Description
                </label>
                <textarea
                  placeholder="Project description..."
                  style="width: 100%; padding: var(--space-3) var(--space-4); border: 1px solid var(--border-default); border-radius: var(--radius-sm); font-size: var(--text-base); font-family: var(--font-body); outline: none; min-height: 100px; resize: vertical;"
                />
              </div>

              <div>
                <label style="display: block; font-size: var(--text-sm); font-weight: 600; margin-bottom: var(--space-2); color: var(--text-primary);">
                  Project Owner
                </label>
                <input
                  type="text"
                  placeholder="e.g., Team A"
                  style="width: 100%; padding: var(--space-3) var(--space-4); border: 1px solid var(--border-default); border-radius: var(--radius-sm); font-size: var(--text-base); font-family: var(--font-body); outline: none;"
                />
              </div>

              <button
                type="submit"
                style="padding: var(--space-3) var(--space-6); background: var(--brand-primary); color: var(--text-inverse); border: none; border-radius: var(--radius-sm); font-weight: 600; font-size: var(--text-base); cursor: pointer; transition: opacity var(--duration-fast) var(--ease-standard);"
              >
                Create Project
              </button>
            </form>
          </div>

          <!-- Projects Table -->
          <div style="background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); overflow: hidden;">
            <div style="padding: var(--space-5); border-bottom: 1px solid var(--border-subtle);">
              <h2 style="margin: 0; font-size: var(--text-lg); font-weight: 600;">All Projects (6)</h2>
            </div>
            <table style="width: 100%; border-collapse: collapse; font-size: var(--text-sm);">
              <thead>
                <tr style="background: var(--surface-sunken); border-bottom: 1px solid var(--border-subtle);">
                  <th style="padding: var(--space-4); text-align: left; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; font-size: var(--text-xs); letter-spacing: 0.5px;">Code</th>
                  <th style="padding: var(--space-4); text-align: left; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; font-size: var(--text-xs); letter-spacing: 0.5px;">Project Name</th>
                  <th style="padding: var(--space-4); text-align: left; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; font-size: var(--text-xs); letter-spacing: 0.5px;">Owner</th>
                  <th style="padding: var(--space-4); text-align: left; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; font-size: var(--text-xs); letter-spacing: 0.5px;">Created</th>
                  <th style="padding: var(--space-4); text-align: center; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; font-size: var(--text-xs); letter-spacing: 0.5px;">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr style="border-bottom: 1px solid var(--border-subtle);">
                  <td style="padding: var(--space-4); font-weight: 600;">Hana</td>
                  <td style="padding: var(--space-4);">HANA NB-IOT</td>
                  <td style="padding: var(--space-4); color: var(--text-secondary);">Team A</td>
                  <td style="padding: var(--space-4); color: var(--text-secondary);">2024-01-15</td>
                  <td style="padding: var(--space-4); text-align: center;">
                    <button style="padding: 4px 8px; background: transparent; color: var(--brand-primary); border: none; border-radius: var(--radius-sm); cursor: pointer; font-size: var(--text-xs); font-weight: 600; margin-right: var(--space-2);">Edit</button>
                    <button style="padding: 4px 8px; background: transparent; color: var(--status-fail); border: none; border-radius: var(--radius-sm); cursor: pointer; font-size: var(--text-xs); font-weight: 600;">Delete</button>
                  </td>
                </tr>
                <tr style="background: var(--surface-sunken); border-bottom: 1px solid var(--border-subtle);">
                  <td style="padding: var(--space-4); font-weight: 600;">BXB</td>
                  <td style="padding: var(--space-4);">Samsung BIXBY</td>
                  <td style="padding: var(--space-4); color: var(--text-secondary);">Team B</td>
                  <td style="padding: var(--space-4); color: var(--text-secondary);">2024-02-10</td>
                  <td style="padding: var(--space-4); text-align: center;">
                    <button style="padding: 4px 8px; background: transparent; color: var(--brand-primary); border: none; border-radius: var(--radius-sm); cursor: pointer; font-size: var(--text-xs); font-weight: 600; margin-right: var(--space-2);">Edit</button>
                    <button style="padding: 4px 8px; background: transparent; color: var(--status-fail); border: none; border-radius: var(--radius-sm); cursor: pointer; font-size: var(--text-xs); font-weight: 600;">Delete</button>
                  </td>
                </tr>
                <tr style="border-bottom: 1px solid var(--border-subtle);">
                  <td style="padding: var(--space-4); font-weight: 600;">BDT</td>
                  <td style="padding: var(--space-4);">Bixby Design Tool</td>
                  <td style="padding: var(--space-4); color: var(--text-secondary);">Team C</td>
                  <td style="padding: var(--space-4); color: var(--text-secondary);">2024-01-20</td>
                  <td style="padding: var(--space-4); text-align: center;">
                    <button style="padding: 4px 8px; background: transparent; color: var(--brand-primary); border: none; border-radius: var(--radius-sm); cursor: pointer; font-size: var(--text-xs); font-weight: 600; margin-right: var(--space-2);">Edit</button>
                    <button style="padding: 4px 8px; background: transparent; color: var(--status-fail); border: none; border-radius: var(--radius-sm); cursor: pointer; font-size: var(--text-xs); font-weight: 600;">Delete</button>
                  </td>
                </tr>
                <tr style="background: var(--surface-sunken); border-bottom: 1px solid var(--border-subtle);">
                  <td style="padding: var(--space-4); font-weight: 600;">AI Rep</td>
                  <td style="padding: var(--space-4);">COMPAL - AI-REPORT</td>
                  <td style="padding: var(--space-4); color: var(--text-secondary);">Team D</td>
                  <td style="padding: var(--space-4); color: var(--text-secondary);">2024-03-05</td>
                  <td style="padding: var(--space-4); text-align: center;">
                    <button style="padding: 4px 8px; background: transparent; color: var(--brand-primary); border: none; border-radius: var(--radius-sm); cursor: pointer; font-size: var(--text-xs); font-weight: 600; margin-right: var(--space-2);">Edit</button>
                    <button style="padding: 4px 8px; background: transparent; color: var(--status-fail); border: none; border-radius: var(--radius-sm); cursor: pointer; font-size: var(--text-xs); font-weight: 600;">Delete</button>
                  </td>
                </tr>
                <tr style="border-bottom: 1px solid var(--border-subtle);">
                  <td style="padding: var(--space-4); font-weight: 600;">GTC</td>
                  <td style="padding: var(--space-4);">Global Transitions Cloud</td>
                  <td style="padding: var(--space-4); color: var(--text-secondary);">Team E</td>
                  <td style="padding: var(--space-4); color: var(--text-secondary);">2024-02-28</td>
                  <td style="padding: var(--space-4); text-align: center;">
                    <button style="padding: 4px 8px; background: transparent; color: var(--brand-primary); border: none; border-radius: var(--radius-sm); cursor: pointer; font-size: var(--text-xs); font-weight: 600; margin-right: var(--space-2);">Edit</button>
                    <button style="padding: 4px 8px; background: transparent; color: var(--status-fail); border: none; border-radius: var(--radius-sm); cursor: pointer; font-size: var(--text-xs); font-weight: 600;">Delete</button>
                  </td>
                </tr>
                <tr style="background: var(--surface-sunken);">
                  <td style="padding: var(--space-4); font-weight: 600;">VLA</td>
                  <td style="padding: var(--space-4);">COMPAL - VLA/NIST</td>
                  <td style="padding: var(--space-4); color: var(--text-secondary);">Team F</td>
                  <td style="padding: var(--space-4); color: var(--text-secondary);">2024-03-12</td>
                  <td style="padding: var(--space-4); text-align: center;">
                    <button style="padding: 4px 8px; background: transparent; color: var(--brand-primary); border: none; border-radius: var(--radius-sm); cursor: pointer; font-size: var(--text-xs); font-weight: 600; margin-right: var(--space-2);">Edit</button>
                    <button style="padding: 4px 8px; background: transparent; color: var(--status-fail); border: none; border-radius: var(--radius-sm); cursor: pointer; font-size: var(--text-xs); font-weight: 600;">Delete</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
